<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爱心限定｜手势交互</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:system-ui,-apple-system,sans-serif;
}
#countBox{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:20px;
  text-align:center;
  padding:20px;
}
#mainBox{
  width:100%;
  height:100%;
  display:none;
  position:relative;
}
video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1); /* 镜像画面 */
}
#heartCanvas{
  position:absolute;
  width:100%;
  height:100%;
}
.tip{margin-bottom:16px;opacity:0.8}
.time{font-size:32px;color:#ff6b81;font-weight:bold}
.load-tip{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  color:#fff;
  z-index:9;
}
</style>
</head>
<body>
<div id="countBox">
  <div class="tip">距离开放还有</div>
  <div class="time" id="timer"></div>
</div>

<div id="mainBox">
  <div class="load-tip" id="loadTip">正在加载手部识别、请求摄像头权限...</div>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="heartCanvas"></canvas>
</div>

<script>
// ========== 定时：明日0点解锁 ==========
function getTargetTime(){
  const now = new Date();
  const target = new Date();
  target.setDate(now.getDate() + 1);
  target.setHours(0,0,0,0);
  return target.getTime();
}
const targetTs = getTargetTime();
const countBox = document.getElementById('countBox');
const mainBox = document.getElementById('mainBox');
const timerDom = document.getElementById('timer');

function formatTime(ms){
  let s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  s = s % 3600;
  const m = Math.floor(s / 60);
  s = s % 60;
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function checkTime(){
  const now = Date.now();
  // now >= targetTs
  if(true){
    countBox.style.display = 'none';
    mainBox.style.display = 'block';
    startApp();
    return true;
  }else{
    const diff = targetTs - now;
    timerDom.innerText = formatTime(diff);
    return false;
  }
}
checkTime();
setInterval(checkTime,1000);

// ===================== 主程序：摄像头 + 手部识别 + 爱心粒子 =====================
let canvas,ctx,video;
let width,height;
let t = 0;
let particleList = [];
// 手势控制：粒子生成速率 0 ~ 1
let spawnRate = 0.15;
// 爱心中心点
let centerX,centerY;

// 粒子类
class Particle{
  constructor(x,y){
    this.x = x;
    this.y = y;
    const ang = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 2.2;
    this.vx = Math.cos(ang) * speed;
    this.vy = Math.sin(ang) * speed;
    this.life = 1;
    this.decay = 0.006 + Math.random() * 0.008;
    this.size = 3 + Math.random() * 6;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.015;
    this.life -= this.decay;
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = "#ff4477";
    ctx.beginPath();
    this.drawMiniHeart(this.x,this.y,this.size);
    ctx.fill();
    ctx.restore();
  }
  drawMiniHeart(cx,cy,scale){
    for(let i=0;i<=360;i+=8){
      const rad = i * Math.PI / 180;
      const x = 16 * Math.pow(Math.sin(rad),3) * scale / 12;
      const y = -(13 * Math.cos(rad) - 5 * Math.cos(2*rad) - 2 * Math.cos(3*rad) - Math.cos(4*rad)) * scale /12;
      if(i===0) ctx.moveTo(cx+x,cy+y);
      else ctx.lineTo(cx+x,cy+y);
    }
    ctx.closePath();
  }
}

// 主心形函数
function heartPoint(scale,angle){
  const x = 16 * Math.pow(Math.sin(angle),3);
  const y = 13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle);
  return {
    x: centerX + x * scale,
    y: centerY - y * scale
  }
}

function resize(){
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2 - 40;
}

async function startApp(){
  canvas = document.getElementById('heartCanvas');
  ctx = canvas.getContext('2d');
  video = document.getElementById('video');
  const loadTip = document.getElementById('loadTip');
  resize();
  window.addEventListener('resize',resize);

  // 初始化手部识别
  const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
  hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });

  hands.onResults(onHandResult);

  const camera = new Camera(video,{
    onFrame: async ()=>{ await hands.send({image:video}); },
    width:Math.min(window.innerWidth,720),
    height:Math.min(window.innerHeight,1280)
  });

  try{
    await camera.start();
    loadTip.innerText = "手势识别就绪，抬手试试！";
    setTimeout(()=>loadTip.style.opacity=0,3000);
  }catch(err){
    loadTip.innerText = "摄像头开启失败，请允许权限或使用HTTPS打开";
    console.error(err);
  }

  renderLoop();
}

// 手部识别回调
function onHandResult(results){
  if(results.multiHandLandmarks && results.multiHandLandmarks.length>0){
    const landmarks = results.multiHandLandmarks[0];
    // 手掌中心点（腕部坐标）
    const wrist = landmarks[0];
    // y范围：0顶部 ~ 1底部
    const y = wrist.y;
    // 映射：手越靠上(y越小) → spawnRate越大
    spawnRate = Math.max(0.02, Math.min(0.45, 0.48 - y * 0.46));
  }else{
    // 没有手，基础少量粒子
    spawnRate = 0.06;
  }
}

function renderLoop(){
  // 拖影效果
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0,0,width,height);

  // 生成新粒子
  if(Math.random() < spawnRate){
    particleList.push(new Particle(centerX,centerY));
  }

  // 更新绘制粒子
  for(let i=particleList.length-1;i>=0;i--){
    const p = particleList[i];
    p.update();
    p.draw();
    if(p.life <= 0) particleList.splice(i,1);
  }

  // 绘制中心跳动大爱心
  const beatScale = 1 + 0.12 * Math.sin(t);
  const scale = Math.min(width,height) / 22 * beatScale;
  ctx.beginPath();
  for(let i=0;i<=360;i+=1){
    const rad = i * Math.PI / 180;
    const p = heartPoint(scale,rad);
    i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y);
  }
  ctx.closePath();
  const gradient = ctx.createRadialGradient(centerX,centerY,0,centerX,centerY,220);
  gradient.addColorStop(0,'#ff88aa');
  gradient.addColorStop(1,'#ff2255');
  ctx.fillStyle = gradient;
  ctx.fill();

  t += 0.04;
  requestAnimationFrame(renderLoop);
}
</script>
</body>
</html>
